<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PDF viewer for past PhilNITS FE exams" />
    <meta name="author" content="EG Belleza" />
    <title>PhilNITS PDF Viewer</title>
    <link rel="icon" href="./assets/images/logo.png" />
    <link rel="stylesheet" href="./styles/main.css" />
    <script type="importmap">
      {
        "imports": {
          "pdfjs-dist": "./lib/pdfjs/pdf.mjs"
        }
      }
    </script>
  </head>

  <body>
    <main>
      <section class="pdf-viewer">
        <div class="pdf-toolbar">
          <button id="previous-page" type="button">Previous</button>

          <label for="page-number">Page</label>

          <input
            id="page-number"
            type="number"
            min="1"
            value="1"
            aria-label="Page number"
          />

          <span id="page-count">/ 1</span>

          <button id="next-page" type="button">Next</button>

          <button id="zoom-out" type="button">−</button>

          <span id="zoom-info">150%</span>

          <button id="zoom-in" type="button">+</button>
        </div>

        <div class="pdf-container">
          <p id="viewer-status" role="status" aria-live="polite">
            Loading PDF...
          </p>
          <canvas id="pdf-canvas"></canvas>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
